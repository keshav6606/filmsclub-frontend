<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="100%" stop-color="#06080D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Outer Film Reel Slots -->
  <rect x="70" y="70" width="372" height="372" rx="70" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="32 16" opacity="0.6" />

  <!-- Inner Glowing Film Clap / Play Symbol -->
  <g transform="translate(256, 256)">
    <!-- Outer Glow Ring -->
    <circle r="140" fill="none" stroke="url(#goldGrad)" stroke-width="16" filter="url(#glow)" opacity="0.9" />
    <!-- Golden Play Triangle -->
    <path d="M-35,-60 L75,0 L-35,60 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  </g>
</svg>
