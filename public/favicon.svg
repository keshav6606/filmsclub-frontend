<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E44" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>
    <linearGradient id="brandCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121520" />
      <stop offset="100%" stop-color="#07080C" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#E50914" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Clean Straight Rounded Base Plate -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#darkBg)" stroke="url(#brandRed)" stroke-width="12" />

  <!-- Clean Straight Play Arrow & Cyan Accent Bar -->
  <g transform="translate(256, 256)" filter="url(#softGlow)">
    <!-- Straight Left Laser Accent Bar (Cyan UHD) -->
    <rect x="-140" y="-120" width="30" height="240" rx="15" fill="url(#brandCyan)" />

    <!-- Straight Play Triangle (Scarlet 4K Cinema) -->
    <path d="M-60 -120 L140 0 L-60 120 Z" fill="url(#brandRed)" />
  </g>
</svg>
