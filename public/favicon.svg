<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="neonRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#990008" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121520" />
      <stop offset="100%" stop-color="#06070B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#bgGrad)" stroke="url(#neonRedGrad)" stroke-width="12" />

  <!-- Outer Film Reel Slots -->
  <rect x="74" y="74" width="364" height="364" rx="70" fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-dasharray="32 16" opacity="0.6" />

  <!-- Inner Glowing Film Clap / Play Symbol -->
  <g transform="translate(256, 256)">
    <!-- Outer Glow Ring -->
    <circle r="135" fill="none" stroke="url(#neonRedGrad)" stroke-width="14" filter="url(#glow)" opacity="0.9" />
    <!-- Play Triangle -->
    <path d="M-35,-65 L80,0 L-35,65 Z" fill="url(#neonRedGrad)" filter="url(#glow)" />
  </g>
</svg>
